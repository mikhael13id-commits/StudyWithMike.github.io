<head>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ANIMASI BACKGROUND SAINS */
  body {
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #0f172a);
    background-size: 400% 400%;
    animation: gradientGerak 15s ease infinite;
    color: #f8fafc;
    font-family: 'Nunito', sans-serif;
    margin: 0 auto;
    padding: 16px;
    max-width: 600px;
    position: relative;
    overflow-x: hidden;
  }

  /* Grid ala kertas matematika/sains */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    z-index: -2;
  }

  /* Ornamen Sains Transparan di Background */
  body::after {
    content: "⚛️ 🔬 🔭 🪐 🧬";
    position: fixed;
    top: 10%; left: 0; right: 0;
    font-size: 60px;
    opacity: 0.05;
    letter-spacing: 20vw;
    line-height: 40vh;
    z-index: -1;
    pointer-events: none;
    text-align: center;
  }

  @keyframes gradientGerak {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ANIMASI KONTEN MUNCUL */
  @keyframes muncul {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animasi-halaman {
    animation: muncul 0.6s ease-out forwards;
  }

  h1, h2 { color: #38bdf8; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
  
  /* DESAIN TOMBOL */
  .btn {
    display: block; width: 100%; margin: 10px 0; padding: 15px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px); /* Efek Kaca */
    color: #fff;
    border: 1px solid #38bdf8;
    border-radius: 12px;
    font-size: 16px; font-weight: 600; text-align: left;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Nunito', sans-serif;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }
  .btn:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }
  .btn.ok { border-color: #22c55e; background: rgba(22, 163, 74, 0.3); }
  
  /* TOMBOL KHUSUS BIRU */
  .biru { background: #38bdf8; color: #0f172a; text-align: center; font-weight: 800; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
  .biru:hover { background: #0284c7; color: #fff; }

  /* KOTAK KONTEN EFEK GLASSMORPHISM */
  .kotak {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; padding: 16px; margin: 12px 0; line-height: 1.6;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  /* WARNA JAWABAN */
  .benar { background: #166534 !important; color: white !important; border-color:#22c55e; }
  .salah { background: #991b1b !important; color: white !important; border-color:#ef4444; }
  
  input {
    width: 65%; padding: 12px; border-radius: 10px; border: 1px solid #334155; 
    font-size: 16px; background: rgba(255,255,255,0.9); font-family: 'Nunito', sans-serif;
  }
  .kecil { color: #cbd5e1; font-size: 14px; font-style: italic; }
  
  #tutor { margin-top: 30px; border-top: 2px dashed rgba(255,255,255,0.2); padding-top: 20px; }
</style>
</head>

var app = document.getElementById("app");
var P = {j:"",k:0,kur:"",m:"",t:0};
var q = 0, skor = 0;
var nilai = {};
try { nilai = JSON.parse(localStorage.getItem("nilaiMike") || "{}"); } catch (e) {}
function simpan(){ try { localStorage.setItem("nilaiMike", JSON.stringify(nilai)); } catch (e) {} }

/* Menambahkan efek animasi pada setiap render halaman */
function tampilkan(t){ 
  app.innerHTML = "<div class='animasi-halaman'>" + t + "</div>"; 
  window.scrollTo({ top: 0, behavior: 'smooth' }); 
}

function tombol(l,f,c){ return "<button class='btn "+(c||"")+"' onclick=\""+f+"\">"+l+"</button>"; }
function daftarMateriList(){ return ISI[P.k+"|"+P.m]; }

function sambutan(){
  tampilkan("<h1>Halo para pejuang Cerdas! 🚀</h1>"+
    "<div class='kotak'>Selamat datang di Tempat belajar Mike, disini semua gratis ya! 🎉 Siapkan dirimu untuk menjadi lebih pintar setiap hari.</div>"+
    "<p style='font-size:18px; font-weight:bold;'>Ingin belajar? Tekan ini ya 👇</p>"+
    tombol("Klik disini ✨","pilihJenjang()","biru"));
}

function pilihJenjang(){
  var h = "<h2>Silakan pilih jenjang terlebih dahulu ya</h2>";
  ["SMP","SMA"].forEach(function(j){ h += tombol("🎒 "+j,"pilihKelas('"+j+"')"); });
  tampilkan(h+tombol("⬅ Kembali","sambutan()"));
}

function pilihKelas(j){
  P.j = j;
  var h = "<h2>Pilih Kelas "+j+"</h2><div class='kotak'>Silakan tentukan kamu kelas berapa agar materinya sesuai ya!</div>";
  KELAS[j].forEach(function(k){ h += tombol("🏫 Kelas "+k,"pilihMapel("+k+")"); });
  tampilkan(h+tombol("⬅ Kembali","pilihJenjang()"));
}

function pilihMapel(k){
  P.k = k;
  var h = "<h2>Pilih Mata Pelajaran</h2>"+
          "<div class='kotak'>Kelas "+k+" "+P.j+"<br><span style='color:#38bdf8; font-weight:bold;'>(Kurikulum Merdeka dan 2013 jadi 1)</span></div>";
  MAPEL[P.j].forEach(function(m){ h += tombol("📘 "+m,"daftarMateri('"+m+"')"); });
  tampilkan(h+tombol("⬅ Kembali","pilihKelas('"+P.j+"')"));
}

function daftarMateri(m){
  P.m = m;
  var list = daftarMateriList();
  var h = "<h2>📚 "+m+" (Kelas "+P.k+")</h2>";
  if (!list) {
    h += "<div class='kotak'>Materi untuk mata pelajaran ini masih disiapkan oleh Mike. Sabar ya! 🙏</div>";
  } else {
    h += "<div class='kotak'>Pilih materi yang ingin kamu pelajari hari ini:</div>";
    list.forEach(function(t,i){
      var n = nilai[P.k+m+i];
      h += tombol(t.judul+(n!==undefined?" 🏆("+n+"/3)":""),"bukaMateri("+i+")", n===3?"ok":"");
    });
  }
  tampilkan(h+tombol("⬅ Pilih Mapel Lain","pilihMapel("+P.k+")"));
}

function bukaMateri(i){
  P.t = i;
  var t = daftarMateriList()[i];
  tampilkan("<h2>"+t.judul+"</h2>"+
    "<div class='kotak'><b>Penjelasan:</b><br>"+t.teks+"</div>"+
    "<div class='kotak'><b>Contoh:</b><br>"+t.contoh+"</div>"+
    "<div class='kotak' style='text-align:center;'><b>Mau coba tes pemahaman?</b><br>Buktikan kalau kamu sudah mengerti!</div>"+
    tombol("Klik disini 📝","mulaiTes()","biru")+
    tombol("⬅ Kembali ke Daftar Materi","daftarMateri('"+P.m+"')"));
}

function mulaiTes(){ q = 0; skor = 0; tampilSoal(); }

function tampilSoal(){
  var t = daftarMateriList()[P.t], s = t.soal[q];
  var h = "<h2>Soal Tes "+(q+1)+" / "+t.soal.length+"</h2><div class='kotak' style='font-size:18px;'><b>Pertanyaan:</b><br>"+s[0]+"</div>";
  s[1].forEach(function(o,n){ h += tombol(o,"pilihJawab("+n+",this)"); });
  tampilkan(h+"<div id='info'></div>");
}

function pilihJawab(n,el){
  var t = daftarMateriList()[P.t], s = t.soal[q];
  var btns = app.querySelectorAll(".btn");
  btns.forEach(function(b){ b.onclick = null; b.style.opacity = "0.7"; }); // Matikan tombol lain
  el.style.opacity = "1";
  
  var benar = n === s[2];
  if (benar) { skor++; el.classList.add("benar"); }
  else { el.classList.add("salah"); btns[s[2]].classList.add("benar"); btns[s[2]].style.opacity = "1"; }
  
  var akhir = q === t.soal.length-1;
  document.getElementById("info").innerHTML =
    "<div class='kotak animasi-halaman'><b>"+(benar?"✅ Jawabanmu Benar! ":"❌ Yah, belum tepat. ")+"</b><br>Penjelasan: "+s[3]+"</div>"+
    tombol(akhir?"Selesai & Lihat Hasil 🏁":"Lanjut Soal Berikutnya ➡", akhir?"hasilTes()":"q++;tampilSoal()","biru");
}

function hasilTes(){
  var t = daftarMateriList()[P.t], key = P.k+P.m+P.t;
  if (nilai[key]===undefined || skor>nilai[key]) nilai[key] = skor;
  simpan();
  var salah = t.soal.length - skor;
  
  var pesanSempurna = "Luar biasa! Semua jawabanmu benar. Kamu memang cerdas! 🔥";
  var pesanSalah = "Masih ada "+salah+" soal yang salah. Jangan menyerah, baca lagi materinya dan coba lagi pas di akhir. Kamu pasti bisa! 💪";
  var pesan = salah === 0 ? pesanSempurna : pesanSalah;
  
  tampilkan("<h1>Skor Akhir: "+skor+" / "+t.soal.length+"</h1>"+
    "<div class='kotak' style='text-align:center;'>"+pesan+"</div>"+
    (salah>0 ? tombol("🔁 Coba Lagi Sekarang","mulaiTes()","biru") : "")+
    "<div class='kotak' style='text-align:center; color:#38bdf8;'>Terima kasih telah mampir di Tempat Belajar Mike! Jangan lelah untuk terus belajar ya! 🙏</div>"+
    tombol("📖 Baca Materi Lagi","bukaMateri("+P.t+")")+
    tombol("📚 Pilih Materi Lain","daftarMateri('"+P.m+"')")+
    tombol("🏠 Kembali ke Beranda","sambutan()"));
}

function tanyaTutor(){
  var teks = document.getElementById("tanya").value.toLowerCase();
  var out = document.getElementById("jawabTutor");
  if (!teks) { out.innerHTML = "<i>Tulis dulu pertanyaannya di kotak ya.</i>"; return; }
  var temu = null;
  for (var key in ISI) ISI[key].forEach(function(t){
    t.kata.forEach(function(w){ if (teks.indexOf(w)!==-1) temu = t; });
  });
  
  out.className = "kotak animasi-halaman";
  out.innerHTML = temu ? "<b>"+temu.judul+"</b><br>"+temu.teks+"<br><i>"+temu.contoh+"</i>"
    : "Wah, sepertinya belum ada materi tentang itu. Coba kata kunci seperti: <b>pecahan</b>, <b>persen</b>, <b>aljabar</b>, atau <b>peluang</b>.";
}

sambutan();
